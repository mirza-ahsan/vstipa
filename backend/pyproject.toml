[project]
name = "vstipa-backend"
version = "0.1.0"
description = "V-STIPA Content Generation Pipeline and Optional Live Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-dotenv>=1.0.1",
    "google-genai>=0.1.1",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "google-cloud-texttospeech>=2.16.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]


